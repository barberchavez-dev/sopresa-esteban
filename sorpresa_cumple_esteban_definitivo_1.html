<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Expediente Confidencial</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --ink:#0b0f19;
  --panel:#12182a;
  --paper:#f3ead9;
  --gold:#c9a24b;
  --thread:#8a2b2b;
  --coral:#ff6b5e;
  --mint:#5ee6c4;
  --text-dim:#a9b0c6;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 10%, rgba(201,162,75,0.08), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(94,230,196,0.06), transparent 40%),
    var(--ink);
  font-family:'Space Grotesk', sans-serif;
  color:var(--paper);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.folder{
  width:100%;
  max-width:460px;
  background:var(--panel);
  border-radius:18px;
  border:1px solid rgba(201,162,75,0.25);
  box-shadow:0 30px 60px rgba(0,0,0,0.5);
  overflow:hidden;
  position:relative;
}

.folder::before{
  content:"";
  position:absolute;
  top:0; left:0; right:0;
  height:3px;
  background:linear-gradient(90deg, var(--gold), var(--thread), var(--gold));
  opacity:0.7;
}

header{
  padding:22px 24px 16px;
  border-bottom:1px dashed rgba(201,162,75,0.3);
}

.case-label{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:2px;
  color:var(--gold);
  text-transform:uppercase;
}

.case-title{
  font-family:'Special Elite', cursive;
  font-size:22px;
  margin:6px 0 2px;
  color:var(--paper);
}

.case-sub{
  font-size:12px;
  color:var(--text-dim);
}

.countdown{
  font-family:'IBM Plex Mono', monospace;
  font-size:34px;
  color:var(--coral);
  text-align:right;
  line-height:1;
  margin-top:-40px;
}

#chat{
  padding:20px;
  min-height:320px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.msg{
  background:rgba(243,234,217,0.06);
  border:1px solid rgba(201,162,75,0.2);
  border-left:3px solid var(--gold);
  padding:14px 16px;
  border-radius:4px 12px 12px 12px;
  font-size:14.5px;
  line-height:1.5;
  animation:appear .5s ease both;
  position:relative;
}

.msg .tag{
  display:block;
  font-family:'IBM Plex Mono', monospace;
  font-size:10px;
  letter-spacing:1.5px;
  color:var(--gold);
  margin-bottom:6px;
  text-transform:uppercase;
}

.msg.user{
  align-self:flex-end;
  background:rgba(255,107,94,0.08);
  border-left:none;
  border-right:3px solid var(--coral);
  border-radius:12px 4px 12px 12px;
  max-width:80%;
}
.msg.user .tag{color:var(--coral); text-align:right;}

#chat{align-items:stretch;}
.msg{align-self:flex-start; max-width:85%;}

.typing{
  display:flex;
  gap:5px;
  padding:14px 16px;
  width:fit-content;
}
.typing span{
  width:6px;height:6px;border-radius:50%;
  background:var(--gold);
  animation:blink 1.1s infinite ease-in-out;
}
.typing span:nth-child(2){animation-delay:.15s;}
.typing span:nth-child(3){animation-delay:.3s;}

@keyframes blink{0%,80%,100%{opacity:.2;transform:translateY(0);}40%{opacity:1;transform:translateY(-3px);}}
@keyframes appear{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

footer{
  padding:16px 20px 22px;
  border-top:1px dashed rgba(201,162,75,0.3);
  display:flex;
  justify-content:center;
}

#inputForm{
  width:100%;
  display:flex;
  gap:8px;
}
#textInput{
  flex:1;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(201,162,75,0.35);
  border-radius:24px;
  padding:11px 16px;
  color:var(--paper);
  font-family:'Space Grotesk', sans-serif;
  font-size:14px;
}
#textInput::placeholder{color:var(--text-dim);}
#textInput:focus{outline:none; border-color:var(--gold);}
#sendBtn{
  border-radius:50%;
  width:42px; height:42px;
  padding:0;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
  font-size:16px;
}
#sendBtn:disabled, #textInput:disabled{opacity:0.4; cursor:not-allowed;}

button{
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;
  letter-spacing:1px;
  text-transform:uppercase;
  background:transparent;
  color:var(--gold);
  border:1px solid var(--gold);
  padding:11px 22px;
  border-radius:30px;
  cursor:pointer;
  transition:all .2s ease;
}
button:hover{background:var(--gold); color:var(--ink);}
button:focus-visible{outline:2px solid var(--mint); outline-offset:2px;}

/* --- Sobre final / reveal --- */
.envelope-wrap{
  display:flex; flex-direction:column; align-items:center; gap:16px;
  padding:10px 4px 4px;
  animation:appear .6s ease both;
}
.envelope{
  width:180px; height:120px;
  background:linear-gradient(160deg, var(--paper), #e6d9bd);
  border-radius:6px;
  position:relative;
  box-shadow:0 12px 30px rgba(0,0,0,0.45);
  cursor:pointer;
}
.envelope::before{
  content:"";
  position:absolute; inset:0;
  background:
    linear-gradient(135deg, transparent 49.5%, rgba(0,0,0,0.12) 50%, transparent 50.5%),
    linear-gradient(-135deg, transparent 49.5%, rgba(0,0,0,0.12) 50%, transparent 50.5%);
}
.seal{
  position:absolute; top:50%; left:50%;
  width:34px; height:34px;
  transform:translate(-50%,-50%);
  background:var(--thread);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:var(--paper);
  font-family:'Special Elite', cursive;
  font-size:16px;
  box-shadow:0 4px 10px rgba(0,0,0,0.4);
}

.reveal{
  display:none;
  width:100%;
  text-align:center;
  animation:appear .7s ease both;
}
.reveal.show{display:block;}
.reveal h2{
  font-family:'Special Elite', cursive;
  color:var(--mint);
  font-size:24px;
  margin:0 0 12px;
}
.reveal p{
  font-size:14px;
  color:var(--text-dim);
  margin-bottom:16px;
}
.media-frame{
  width:100%;
  border-radius:10px;
  overflow:hidden;
  border:2px solid var(--mint);
  box-shadow:0 0 30px rgba(94,230,196,0.25);
}
.media-frame img, .media-frame video{
  width:100%; display:block;
}
.placeholder-media{
  padding:40px 20px;
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  color:var(--text-dim);
  background:rgba(255,255,255,0.03);
  border:1px dashed rgba(201,162,75,0.4);
  border-radius:10px;
}

#confetti-canvas{
  position:fixed; inset:0; pointer-events:none; z-index:50;
}

@media (prefers-reduced-motion: reduce){
  .msg, .envelope-wrap, .reveal{animation:none !important;}
  .typing span{animation:none !important;}
}
</style>
</head>

</div>

/* ========================================================= */

function normalizar(texto){
  return texto
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // quita tildes
    .replace(/[^a-z0-9\s]/g, ' ') // signos de puntuación fuera
    .replace(/\s+/g, ' ')
    .trim();
}

function esCorrecta(preguntaIndex, textoUsuario){
  const pregunta = CONFIG.preguntas[preguntaIndex];
  if (pregunta.cualquierRespuesta) return true;
  const norm = normalizar(textoUsuario);
  return pregunta.claves.some(clave => norm.includes(normalizar(clave)));
}

function aleatorio(lista){
  return lista[Math.floor(Math.random()*lista.length)];
}

const chat = document.getElementById('chat');
const countdownEl = document.getElementById('countdown');
const caseSub = document.getElementById('caseSub');
const footer = document.getElementById('footer');
const inputForm = document.getElementById('inputForm');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');

let paso = 0; // índice de la pregunta actual (0..preguntas.length-1)

function addMessage(text, tag, isUser){
  const div = document.createElement('div');
  div.className = 'msg' + (isUser ? ' user' : '');
  div.innerHTML = `<span class="tag">${tag}</span>${text}`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping(callback){
  const t = document.createElement('div');
  t.className = 'msg typing';
  t.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(t);
  chat.scrollTop = chat.scrollHeight;
  setTimeout(() => {
    t.remove();
    callback();
  }, 800 + Math.random()*500);
}

function updateCountdown(){
  const restantes = CONFIG.preguntas.length - paso;
  countdownEl.textContent = restantes > 0 ? restantes : "0";
}

function setInputEnabled(enabled){
  textInput.disabled = !enabled;
  sendBtn.disabled = !enabled;
  if (enabled) textInput.focus();
}

function preguntar(index){
  addMessage(CONFIG.preguntas[index].texto, `Pregunta 0${index+1}`);
  updateCountdown();
  setInputEnabled(true);
}

// Arranca la conversación: mensaje inicial y luego la primera pregunta
function startChat(){
  setInputEnabled(false);
  showTyping(() => {
    addMessage(CONFIG.mensajeInicio, 'Mensaje');
    showTyping(() => {
      preguntar(0);
    });
  });
}

inputForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = textInput.value.trim();
  if (!text) return;

  addMessage(text, 'Tú', true);
  textInput.value = '';
  setInputEnabled(false);

  showTyping(() => {
    if (esCorrecta(paso, text)){
      const preguntaActual = CONFIG.preguntas[paso];
      addMessage(preguntaActual.respuestaEspecial || aleatorio(CONFIG.respuestasCorrectas), 'Correcto');
      paso++;
      if (paso < CONFIG.preguntas.length){
        showTyping(() => preguntar(paso));
      } else {
        showTyping(() => {
          addMessage(CONFIG.mensajeFinal, 'Cierre del expediente');
          showEnvelope();
        });
      }
    } else {
      const preguntaActual = CONFIG.preguntas[paso];
      addMessage(preguntaActual.respuestaIncorrectaEspecial || aleatorio(CONFIG.respuestasIncorrectas), 'Incorrecto');
      setInputEnabled(true);
    }
  });
});

function showEnvelope(){
  footer.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'envelope-wrap';
  wrap.innerHTML = `
    <div class="envelope" id="envelope" tabindex="0" role="button" aria-label="Abrir sobre">
      <div class="seal">✦</div>
    </div>
    <p style="font-size:12px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;">
      Toca el sobre para abrirlo
    </p>
  `;
  footer.appendChild(wrap);

  const envelope = document.getElementById('envelope');
  const open = () => { openReveal(); };
  envelope.addEventListener('click', open);
  envelope.addEventListener('keypress', (e) => { if(e.key === 'Enter') open(); });
}

function openReveal(){
  footer.innerHTML = '';
  const reveal = document.createElement('div');
  reveal.className = 'reveal';
  reveal.id = 'reveal';

  let mediaHtml = '';
  if (CONFIG.media.url){
    if (CONFIG.media.tipo === 'video'){
      mediaHtml = `<div class="media-frame"><video src="${CONFIG.media.url}" controls autoplay></video></div>`;
    } else {
      mediaHtml = `<div class="media-frame"><img src="${CONFIG.media.url}" alt="Sorpresa"></div>`;
    }
  } else {
    mediaHtml = `<div class="placeholder-media">
      Aquí se mostrará tu foto o video.<br>
      Edita CONFIG.media.url en el código con el enlace directo a tu archivo.
    </div>`;
  }

  reveal.innerHTML = `
    <h2>¡Sorpresa, ${CONFIG.nombreDestinatario}!</h2>
    ${mediaHtml}
    <p>${CONFIG.mensajeSorpresa}</p>
  `;
  chat.innerHTML = '';
  chat.appendChild(reveal);
  requestAnimationFrame(() => reveal.classList.add('show'));
  launchConfetti();
}

/* --- Confeti simple con canvas --- */
function launchConfetti(){
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ['#c9a24b', '#ff6b5e', '#5ee6c4', '#f3ead9'];
  const pieces = Array.from({length: 140}, () => ({
    x: Math.random()*canvas.width,
    y: -20 - Math.random()*canvas.height*0.5,
    w: 6 + Math.random()*6,
    h: 8 + Math.random()*8,
    speed: 2 + Math.random()*3,
    drift: (Math.random()-0.5)*2,
    rot: Math.random()*360,
    rotSpeed: (Math.random()-0.5)*8,
    color: colors[Math.floor(Math.random()*colors.length)]
  }));

  let frame = 0;
  function tick(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      p.y += p.speed;
      p.x += p.drift;
      p.rot += p.rotSpeed;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    if (frame < 260){
      requestAnimationFrame(tick);
    } else {
      ctx.clearRect(0,0,canvas.width,canvas.height);
    }
  }
  tick();
}

updateCountdown();
startChat();
</script>
